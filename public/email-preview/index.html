<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Onboarding email previews</title><style>*{box-sizing:border-box}body{margin:0;background:#f4f2ed;color:#24231f;font:14px Arial,sans-serif}header{padding:20px 24px;background:#fff;border-bottom:1px solid #e5e1d9}h1{font-size:18px;margin:0 0 6px}header p{color:#77736a;font-size:12px;margin:0}nav{display:flex;gap:8px;flex-wrap:wrap;margin-top:18px}button{font:inherit;border:1px solid #dedad2;background:white;border-radius:5px;padding:10px 14px;cursor:pointer}button[aria-pressed=true]{background:#24231f;color:white;border-color:#24231f}.meta{max-width:660px;margin:22px auto 0;padding:0 24px;font-size:12px;color:#6d6a63;line-height:1.8}.meta strong{color:#24231f}iframe{border:0;display:block;width:100%;height:1250px}a{color:#a94b31}</style></head><body><header><h1>Welcome to the community</h1><p>Three onboarding emails · local design preview</p><nav aria-label="Email sequence"><button data-stage="welcome" aria-pressed="true">01 &nbsp; Welcome · 4 minutes</button><button data-stage="launches" aria-pressed="false">02 &nbsp; Latest launches · 6 hours</button><button data-stage="followup" aria-pressed="false">03 &nbsp; Discover more · 4 days</button></nav></header><div class="meta"><div><strong>To:</strong> Deepak Kumar</div><div><strong>Subject:</strong> <span id="subject">Welcome to Claude AI Directory</span></div><a id="text" href="welcome.txt" target="_blank">View plain-text version</a></div><iframe title="Email preview" src="welcome.html"></iframe><script>const frame=document.querySelector('iframe');function fitPreview(){try{frame.style.height=(frame.contentDocument.documentElement.scrollHeight+24)+'px';}catch{}}frame.addEventListener('load',()=>{fitPreview();frame.contentDocument.querySelectorAll('img').forEach(img=>img.addEventListener('load',fitPreview));});window.addEventListener('resize',()=>{frame.style.height='1px';fitPreview();});const subjects={welcome:'Welcome to Claude AI Directory',launches:"5 new launches to explore this week",followup:"5 new launches to explore this week"};document.querySelectorAll('button').forEach(button=>button.addEventListener('click',()=>{document.querySelectorAll('button').forEach(b=>b.setAttribute('aria-pressed',String(b===button)));let stage=button.dataset.stage;document.querySelector('iframe').src=stage+'.html';document.querySelector('#subject').textContent=subjects[stage];document.querySelector('#text').href=stage+'.txt';}));</script></body></html>
